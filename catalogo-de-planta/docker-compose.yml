services:
  postgres:
    image: postgres:16
    container_name: catalogo-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalogo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./back-end
    container_name: catalogo-backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: catalogo

  frontend:
    build: ./front-end
    container_name: catalogo-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: